[phases.setup]
nixPkgs = ['php82', 'php82Extensions.pdo', 'php82Extensions.pdo_pgsql', 'php82Extensions.mbstring', 'php82Extensions.xml', 'php82Extensions.gd', 'php82Extensions.zip', 'php82Extensions.bcmath', 'php82Extensions.curl', 'php82Extensions.fileinfo', 'php82Extensions.tokenizer']

[phases.install]
cmds = ['composer install --no-dev --optimize-autoloader --no-scripts']

[phases.build]
cmds = [
    'npm install',
    'npm run build',
    'php artisan package:discover --ansi'
]

[start]
cmd = 'php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan migrate --force && php -S 0.0.0.0:${PORT:-8000} -t public'
